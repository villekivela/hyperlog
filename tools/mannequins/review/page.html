<title>Mannequin Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* A proof sheet: one card per exercise, its stage on top as on the phone, then its checks and verdict. */
:root {
  --ground: #ececef;
  --card: #f8f8fa;
  --stage: #e3e3e8;
  --ink: #1c1c20;
  --quiet: #5f5f68;
  --line: #d2d2d8;
  --ok: #2f7a4f;
  --ok-tint: #dcefe3;
  --note: #8a5a00;
  --note-tint: #f6e9cc;
  --fail: #b3261e;
  --focus: #3b5bdb;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --text: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  /* The clay mannequin's greys and the kits' tones (GraphitePalette.kt, ClayColours); the rim is
     the light from behind that gives a dark frame its edge. */
  --clay-body: #babac1; --clay-joint: #9a9aa1; --clay-frame: #2e2e33; --clay-vinyl: #1b1b1e; --clay-plate: #8a8a90; --clay-metal: #c8c8cc; --clay-pulley: #5c5c62; --clay-shadow: 0.65; --clay-rim: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131315; --card: #1f1f22; --stage: #2e2e33; --ink: #e8e8ec; --quiet: #a2a2ab; --line: #38383e;
    --ok: #7fcf9c; --ok-tint: #1d3326; --note: #e6b85c; --note-tint: #3a2e15; --fail: #f2b8b5; --focus: #9db0ff;
    --clay-body: #c4c4ca; --clay-joint: #a8a8af; --clay-frame: #4a4a50; --clay-vinyl: #2e2e33; --clay-plate: #8a8a90; --clay-metal: #c8c8cc; --clay-pulley: #6e6e75; --clay-shadow: 1; --clay-rim: 0.7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #131315; --card: #1f1f22; --stage: #2e2e33; --ink: #e8e8ec; --quiet: #a2a2ab; --line: #38383e;
  --ok: #7fcf9c; --ok-tint: #1d3326; --note: #e6b85c; --note-tint: #3a2e15; --fail: #f2b8b5; --focus: #9db0ff;
  --clay-body: #c4c4ca; --clay-joint: #a8a8af; --clay-frame: #4a4a50; --clay-vinyl: #2e2e33; --clay-plate: #8a8a90; --clay-metal: #c8c8cc; --clay-pulley: #6e6e75; --clay-shadow: 1; --clay-rim: 0.7;
  color-scheme: dark;
}
body {
  background: var(--ground); color: var(--ink); font: 15px/1.5 var(--text);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font: 600 clamp(26px, 4vw, 34px)/1.1 var(--display); letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--quiet); max-width: 62ch; }
.tally { font: 500 14px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--quiet); text-align: right; }
.tally strong { display: block; font: 600 28px/1 var(--display); color: var(--ink); }
.banner { margin: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--quiet); }
.banner:empty { display: none; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; min-width: 0; }
.stage { position: relative; aspect-ratio: 5 / 4; max-width: 100%; background: var(--stage); touch-action: pan-y; cursor: grab; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .hint { position: absolute; left: 10px; bottom: 8px; font: 12px var(--mono); color: var(--quiet); pointer-events: none; }
.body { padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
.title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { font: 600 20px/1.2 var(--display); margin: 0; }
.meta { font: 12px var(--mono); color: var(--quiet); letter-spacing: 0.04em; text-transform: uppercase; }
.state { font: 600 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; color: var(--quiet); border: 1px solid var(--line); }
.state[data-state="ok"] { color: var(--ok); background: var(--ok-tint); border-color: transparent; }
.state[data-state="notes"], .state[data-state="changed"] { color: var(--note); background: var(--note-tint); border-color: transparent; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.checks li { display: grid; grid-template-columns: 14px 86px 1fr; gap: 8px; align-items: baseline; min-width: 0; }
.checks .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); align-self: center; }
.checks li[data-ok="false"] .mark { background: var(--fail); }
.checks .name { font-weight: 500; }
.checks .found { font: 12px var(--mono); color: var(--quiet); overflow-wrap: anywhere; }
label { font-size: 13px; font-weight: 500; }
textarea { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; font: 14px/1.4 var(--text); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 14px var(--text); border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
button.ok { background: var(--ink); color: var(--card); border-color: var(--ink); }
button.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, textarea:focus-visible, .stage:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.saved { font: 12px var(--mono); color: var(--quiet); }
.saved[data-error] { color: var(--fail); font-weight: 500; }
.copybox { width: 100%; min-height: 5em; margin-top: 8px; font: 12px var(--mono); }
.state[data-state="tuned"] { color: var(--ok); background: var(--ok-tint); border-color: transparent; }
.tune { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.tune[hidden] { display: none; }
.tune .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg.angles { display: inline-flex; width: fit-content; }
.seg.angles[hidden] { display: none; }
.seg.angles button { border: 0; border-radius: 0; padding: 6px 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.seg.angles button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.tune .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tune .seg button { border: 0; border-radius: 0; padding: 6px 12px; font-weight: 500; }
.tune .seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.tune details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.tune summary { font: 600 13px var(--display); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
.tune .row { display: grid; grid-template-columns: minmax(70px, 1fr) 30px minmax(80px, 2fr) 30px 76px 28px auto; gap: 6px; align-items: center; padding: 3px 0; }
.tune .row label { font: 12px var(--mono); overflow-wrap: anywhere; }
.tune .row input[type="range"] { width: 100%; min-width: 0; }
.tune .row .step, .tune .row .undo { padding: 0; height: 30px; font-size: 16px; line-height: 1; }
.tune .row .undo { height: 28px; border-color: transparent; color: var(--quiet); }
.tune .row .undo:disabled { visibility: hidden; }
.tune .row input.value { width: 100%; box-sizing: border-box; min-width: 0; font: 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
.tune .row input.value:focus-visible, .tune .row input[type="range"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tune .row[data-changed="true"] label, .tune .row[data-changed="true"] input.value { color: var(--note); font-weight: 600; }
.tune .row .scope { padding: 4px 8px; font: 11px var(--mono); font-weight: 500; white-space: nowrap; color: var(--quiet); }
.tune .row .scope[hidden] { display: none; }
.tune .row .scope[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.tune .row[data-per="true"] label { text-decoration: underline dotted; }
.tune .unit { font: 11px var(--mono); color: var(--quiet); }
/* A card being tuned keeps its stage in view while the list scrolls: stuck to the top on a narrow
   window, on the left beside the list (which scrolls on its own) on a wide one. */
.card.tuning { overflow: visible; grid-column: 1 / -1; }
.card.tuning .stage { position: sticky; top: 0; z-index: 5; width: min(100%, calc(42vh * 1.25)); margin-inline: auto; border-radius: 12px 12px 0 0; }
.card.tuning .actions { position: sticky; bottom: 0; z-index: 4; background: var(--card); padding-block: 8px; border-top: 1px solid var(--line); }
@media (min-width: 900px) {
  .card.tuning { grid-template-columns: minmax(380px, 5fr) minmax(420px, 6fr); align-items: start; }
  .card.tuning .stage { top: 16px; width: 100%; margin: 0; border-radius: 12px 0 0 12px; }
  .card.tuning .body { max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; position: sticky; top: 16px; }
}
.tune .count { font: 12px var(--mono); color: var(--quiet); }
</style>

<main>
  <header>
    <div>
      <h1 id="heading">Mannequin review</h1>
      <p class="lede">Each clip loops at a generic tempo: down, hold, up, hold. Drag sideways to turn a mannequin, double-tap to reset. Mark it OK, or leave a note for the next pass. An OK counts for the clip shown; a re-baked clip needs a new one.</p>
    </div>
    <div class="tally" aria-live="polite"><strong id="count">–</strong><span id="count-of">OK</span></div>
  </header>
  <p class="banner" id="banner" role="status"></p>
  <section class="sheet" id="sheet" aria-label="Exercises"></section>
</main>

<template id="card">
  <article class="card">
    <div class="stage" tabindex="0" aria-label=""><canvas></canvas><span class="hint">drag to turn</span></div>
    <div class="body">
      <div class="title">
        <div><h2></h2><div class="meta"></div></div>
        <span class="state" data-state="waiting">Waiting</span>
      </div>
      <div class="seg angles" role="group" aria-label="Bench angle" hidden></div>
      <ul class="checks"></ul>
      <section class="tune" hidden aria-label="Tune the pose">
        <div class="bar">
          <div class="seg" role="group" aria-label="Show">
            <button type="button" data-show="loop" aria-pressed="true">Loop</button>
            <button type="button" data-show="top" aria-pressed="false">Top</button>
            <button type="button" data-show="bottom" aria-pressed="false">Bottom</button>
          </div>
          <span class="count" aria-live="polite"></span>
          <button type="button" class="copy">Copy numbers</button>
          <button type="button" class="reset">Reset all</button>
        </div>
        <div class="sliders"></div>
      </section>
      <div>
        <label></label>
        <textarea placeholder="What should change in this pose?"></textarea>
      </div>
      <div class="actions">
        <button class="ok" type="button" aria-pressed="false">OK</button>
        <button class="tuneButton" type="button" aria-expanded="false">Tune</button>
        <button class="save" type="button">Save note</button>
        <span class="saved" aria-live="polite"></span>
      </div>
    </div>
  </article>
</template>

<script type="application/json" id="batch">/*BATCH*/{}</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/*TUNE*/
const BATCH = JSON.parse(document.getElementById('batch').textContent);
const CHECKS = { hands: 'Hands', feet: 'Feet', equipment: 'Equipment', joints: 'Joints', trace: 'Trace' };
const STATES = { ok: 'OK', tuned: 'OK · tuned', notes: 'Notes', changed: 'Clip changed', waiting: 'Waiting' };
// One rep at a generic tempo, in seconds: down, hold at the bottom, up, hold at the top.
const TEMPO = [1.6, 0.4, 1.2, 0.6];
const still = matchMedia('(prefers-reduced-motion: reduce)');
const sheet = document.getElementById('sheet');
const banner = document.getElementById('banner');
document.getElementById('heading').textContent = `Mannequin review: ${BATCH.batch}`;

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Each clip is whole and parsed from its own bytes: the page fetches nothing.
const bytesOf = (dataUri) => Uint8Array.from(atob(dataUri.split(',')[1]), (c) => c.charCodeAt(0)).buffer;
const verdicts = {};
const sorted = (o) => Object.fromEntries(Object.entries(o).sort(([a], [b]) => (a < b ? -1 : 1)));
const cards = {};

// The tuned values are saved as JSON text: the paths have dots in them, which a database's keys may not.
const tunedOf = (v) => { try { return JSON.parse(v?.tuned || '{}'); } catch { return {}; } };

function stateOf(e) {
  const v = verdicts[e.id];
  if (!v) return 'waiting';
  if (v.ok && v.clip === e.hash) return Object.keys(tunedOf(v)).length ? 'tuned' : 'ok';
  if (v.ok) return 'changed';
  return v.note ? 'notes' : 'waiting';
}

function render() {
  let ok = 0;
  for (const e of BATCH.exercises) {
    const c = cards[e.id];
    const state = stateOf(e);
    if (state === 'ok' || state === 'tuned') ok++;
    c.refreshMarks?.();
    c.state.dataset.state = state;
    c.state.textContent = STATES[state];
    const isOk = state === 'ok' || state === 'tuned';
    c.ok.setAttribute('aria-pressed', String(isOk));
    c.ok.textContent = isOk ? 'OK ✓' : 'OK';
    const v = verdicts[e.id];
    if (v && document.activeElement !== c.note && !c.dirty) c.note.value = v.note ?? '';
  }
  document.getElementById('count').textContent = `${ok} of ${BATCH.exercises.length}`;
  document.getElementById('count-of').textContent = ok === BATCH.exercises.length ? 'OK: the batch is done' : 'OK';
}

// The stages: one renderer per card, drawn while it's on screen.
function stage(e, canvas, holder) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x77777f, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(2.2, 4, 2.6);
  scene.add(sun);
  // From behind the kit, wherever the stage is turned: only dark lights it (--clay-rim).
  const rim = new THREE.DirectionalLight(0xffffff, 0);
  scene.add(rim, rim.target);
  const camera = new THREE.PerspectiveCamera(26, 5 / 4, 0.05, 50);
  // How the stage frames the clip shown: an adjustable bench frames each of its angles on its own.
  let cam = e.camera;
  const target = new THREE.Vector3(...cam.target);
  let distance = cam.halfHeight / Math.tan(THREE.MathUtils.degToRad(13));
  let azimuth = cam.azimuth;
  let mixer = null;
  let duration = 1;
  let materials = [];
  // The Tune panel poses the body live in place of the clip: `live` is its stage.
  let clipScene = null;
  let live = null;
  let show = 'loop';
  // Drag handles (the Tune panel): dots on the body that, dragged, set the pose numbers.
  const markers = new THREE.Group();
  scene.add(markers);
  const dot = new THREE.SphereGeometry(1, 16, 12);
  let handles = [];
  let onDrag = () => {};
  let dragging = null;
  const place = () => {
    const a = THREE.MathUtils.degToRad(azimuth);
    const el = THREE.MathUtils.degToRad(cam.elevation);
    camera.position.set(target.x + distance * Math.cos(el) * Math.sin(a), target.y + distance * Math.sin(el), target.z + distance * Math.cos(el) * Math.cos(a));
    camera.lookAt(target);
    const back = a + THREE.MathUtils.degToRad(160);
    rim.position.set(target.x + 5 * Math.sin(back), target.y + 3, target.z + 5 * Math.cos(back));
    rim.target.position.copy(target);
  };
  const colour = () => {
    scene.background = new THREE.Color(css('--stage'));
    rim.intensity = Number(css('--clay-rim')) || 0;
    for (const m of materials) {
      if (m.name === 'shadow') m.opacity = Number(css('--clay-shadow')) || 0.65;
      else if (css(`--clay-${m.name}`)) m.color.set(css(`--clay-${m.name}`));
    }
  };
  place();
  colour();
  const loadClip = (url) => new GLTFLoader().parse(bytesOf(url), '', (gltf) => {
    if (clipScene) scene.remove(clipScene);
    scene.add(gltf.scene);
    clipScene = gltf.scene;
    clipScene.visible = !live;
    gltf.scene.traverse((o) => { if (o.material) materials.push(o.material); });
    mixer = new THREE.AnimationMixer(gltf.scene);
    duration = gltf.animations[0].duration;
    mixer.clipAction(gltf.animations[0]).play();
    colour();
  }, () => { holder.querySelector('.hint').textContent = 'the clip didn\'t load'; });
  loadClip(e.clip);
  // An adjustable bench's other angles: that angle's clip, framed as it is.
  const setAngle = (angle) => {
    const at = e.angles[angle];
    cam = at.camera;
    target.set(...cam.target);
    distance = cam.halfHeight / Math.tan(THREE.MathUtils.degToRad(13));
    azimuth = cam.azimuth;
    place();
    loadClip(at.clip);
  };

  // Down, hold, up, hold; with motion reduced, the bottom of the rep, still.
  const at = (t) => {
    if (still.matches) return 1;
    const [down, hold, up, rest] = TEMPO;
    const p = t % (down + hold + up + rest);
    if (p < down) return p / down;
    if (p < down + hold) return 1;
    if (p < down + hold + up) return 1 - (p - down - hold) / up;
    return 0;
  };
  const draw = (seconds) => {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    const along = show === 'top' ? 0 : show === 'bottom' ? 1 : at(seconds);
    if (live) live.pose(Math.min(along, 1));
    else if (mixer) mixer.setTime(Math.min(along, 0.9999) * duration);
    for (const m of markers.children) m.scale.setScalar(camera.position.distanceTo(m.position) * 0.016);
    renderer.render(scene, camera);
  };

  // A sideways drag turns it; the page keeps vertical drags. A double-tap resets the view.
  let from = null;
  const ray = new THREE.Raycaster();
  const pointer = (ev) => {
    const r = canvas.getBoundingClientRect();
    return new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  };
  holder.addEventListener('pointerdown', (ev) => {
    holder.setPointerCapture(ev.pointerId);
    if (handles.length) {
      const r = canvas.getBoundingClientRect();
      let best = null;
      let nearest = 28;
      for (const h of handles) {
        const p = h.at.clone().project(camera);
        const d = Math.hypot(((p.x + 1) / 2) * r.width - (ev.clientX - r.left), ((1 - p.y) / 2) * r.height - (ev.clientY - r.top));
        if (d < nearest) { nearest = d; best = h; }
      }
      if (best) {
        const normal = camera.getWorldDirection(new THREE.Vector3());
        dragging = { id: best.id, plane: new THREE.Plane().setFromNormalAndCoplanarPoint(normal, best.at) };
        holder.querySelector('.hint').textContent = `dragging the ${best.label}`;
        ev.preventDefault();
        return;
      }
    }
    from = ev.clientX;
  });
  holder.addEventListener('pointermove', (ev) => {
    if (dragging) {
      ray.setFromCamera(pointer(ev), camera);
      const point = ray.ray.intersectPlane(dragging.plane, new THREE.Vector3());
      const h = handles.find((x) => x.id === dragging.id);
      if (point && h) onDrag(h, point);
      return;
    }
    if (from === null) return;
    azimuth -= (ev.clientX - from) * 0.5;
    from = ev.clientX;
    place();
  });
  const end = () => {
    from = null;
    if (dragging) holder.querySelector('.hint').textContent = 'drag the dots to pose, or turn it';
    dragging = null;
  };
  holder.addEventListener('pointerup', end);
  holder.addEventListener('pointercancel', end);
  holder.addEventListener('dblclick', () => { azimuth = cam.azimuth; place(); });
  holder.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { azimuth += ev.key === 'ArrowLeft' ? 10 : -10; place(); ev.preventDefault(); }
  });
  const setLive = (next) => {
    if (live) scene.remove(live.scene);
    live = next;
    if (live) {
      scene.add(live.scene);
      live.scene.traverse((o) => { if (o.material) materials.push(o.material); });
      colour();
    }
    if (clipScene) clipScene.visible = !live;
  };
  // The handles, and what a drag of one does with the point it was dragged to.
  const setHandles = (list, drag) => {
    handles = list;
    onDrag = drag;
    markers.clear();
    for (const h of list) {
      const m = new THREE.Mesh(dot, new THREE.MeshBasicMaterial({ color: 0xff7a1a, depthTest: false, transparent: true, opacity: 0.92 }));
      m.renderOrder = 10;
      m.position.copy(h.at);
      markers.add(m);
    }
    holder.querySelector('.hint').textContent = list.length ? 'drag the dots to pose, or turn it' : 'drag to turn';
    // Where each dot is on the page, for whoever tests the page.
    const r = canvas.getBoundingClientRect();
    holder.dataset.handles = JSON.stringify(Object.fromEntries(list.map((h) => {
      const p = h.at.clone().project(camera);
      return [h.id, [Math.round(r.left + ((p.x + 1) / 2) * r.width), Math.round(r.top + ((1 - p.y) / 2) * r.height)]];
    })));
  };
  return { draw, colour, setLive, setHandles, setAngle, setShow: (v) => { show = v; } };
}

/** The check results as the list shows them: a dot, the check, and the worst of it. */
function fillChecks(list, checks) {
  list.replaceChildren();
  for (const [key, label] of Object.entries(CHECKS)) {
    const c = checks[key];
    const li = document.createElement('li');
    li.dataset.ok = String(c.ok);
    li.innerHTML = '<span class="mark" aria-hidden="true"></span><span class="name"></span><span class="found"></span>';
    li.querySelector('.name').textContent = `${label}${c.ok ? '' : ' failed'}`;
    li.querySelector('.found').textContent = c.frame === null ? c.found : `worst at frame ${c.frame}: ${c.found}`;
    list.append(li);
  }
}

/**
 * The Tune panel of one card: a slider for each number of the pose entry, the body posed live with
 * the tool's own code (the bundle above) in place of the clip, and the checks run on what it shows.
 * The tuned values are `{ path: value }`, saved with the OK.
 */
function tuning(e, node, card, s) {
  const panel = node.querySelector('.tune');
  const button = node.querySelector('.tuneButton');
  const box = panel.querySelector('.sliders');
  const count = panel.querySelector('.count');
  const list = node.querySelector('.checks');
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  let opened = false;
  let body = null;
  let tuned = {};
  let rows = [];
  let built = null;
  let timer = 0;
  let frame = 0;
  let building = false;
  let again = false;

  // Whether the numbers on the sliders differ from what the verdict has saved.
  const unsaved = () => JSON.stringify(sorted(tuned)) !== JSON.stringify(sorted(tunedOf(verdicts[e.id])));
  card.unsaved = () => opened && unsaved();
  // An adjustable bench is posed at the angle shown, each Per angle setting at its value there.
  const entryNow = () => {
    const entry = tune.applyTuned(e.entry, tuned);
    return entry.bench ? tune.atAngle(entry, card.angle) : entry;
  };
  const valueNow = (t) => tune.valueAt(entryNow(), t.path) ?? t.value;
  // What a setting goes back to: the value last saved with an OK, otherwise the entry's own.
  const savedOf = (t) => tune.valueAt(tune.applyTuned(e.entry, tunedOf(verdicts[e.id])), t.path) ?? t.value;
  // The Per angle settings, `{ path: { angle: value } }`: the tuned ones, else the entry's own. A change
  // is kept in `tuned['@angles']` only while it differs from the entry's.
  const perOf = (t) => t['@angles'] ?? e.entry.bench?.perAngle ?? {};
  const perMap = () => perOf(tuned);
  const savedPer = () => perOf(tunedOf(verdicts[e.id]));
  const setPer = (path, map) => {
    const next = JSON.parse(JSON.stringify(perMap()));
    if (map === undefined) delete next[path]; else next[path] = map;
    if (same(next, e.entry.bench?.perAngle ?? {})) delete tuned['@angles']; else tuned['@angles'] = next;
  };
  // The angle buttons say which angles have something tuned.
  card.refreshMarks = () => {
    const known = new Set(tune.tunedAngles({ bench: { perAngle: perOf(opened ? tuned : tunedOf(verdicts[e.id])) } }));
    for (const [a, b] of Object.entries(card.angleButtons ?? {})) {
      b.textContent = `${a}°${known.has(Number(a)) ? ' \u2022' : ''}`;
      b.title = known.has(Number(a)) ? 'Something is tuned at this angle' : '';
    }
  };
  const paint = () => {
    for (const r of rows) {
      const v = valueNow(r.t);
      const per = perMap()[r.t.path];
      r.input.value = v;
      if (document.activeElement !== r.num) r.num.value = Number(v.toFixed(3));
      r.row.dataset.changed = String(per ? !same(per, e.entry.bench?.perAngle?.[r.t.path]) : v !== r.t.value);
      r.row.dataset.per = String(Boolean(per));
      const own = Object.keys(per ?? {}).map((a) => `${a}°`).join(', ');
      r.scope.setAttribute('aria-pressed', String(Boolean(per)));
      r.scope.textContent = per ? 'Per angle' : 'All angles';
      r.scope.title = per ? `Tuned at ${own || 'no angle yet'}; the others interpolate. Click for the same at every angle.` : 'The same at every angle. Click to tune per angle.';
      r.undo.disabled = same(per, savedPer()[r.t.path]) && (per ? true : v === savedOf(r.t));
    }
    card.refreshMarks();
    card.saved.removeAttribute('data-error');
    card.saved.textContent = unsaved() ? 'Unsaved: press OK to save' : '';
  };

  const checkSoon = () => {
    clearTimeout(timer);
    count.textContent = 'Checking…';
    timer = setTimeout(() => {
      fillChecks(list, tune.checkStage(built.entry, built.stage));
      count.textContent = `${Object.keys(tuned).filter((k) => k !== '@angles').length + Object.keys(tuned['@angles'] ?? {}).length} changed`;
    }, 200);
  };
  const rebuild = async () => {
    if (building) { again = true; return; }
    building = true;
    try {
      const entry = entryNow();
      body ??= await tune.parseMannequin(bytesOf(BATCH.mannequin));
      const stage = await tune.buildStage(entry, body);
      s.setLive(stage);
      built = { entry, stage };
      handles();
      checkSoon();
    } catch (err) {
      count.textContent = `Can't pose this: ${err.message}`;
    } finally {
      building = false;
      if (again) { again = false; rebuild(); }
    }
  };

  // A value goes in at its path, or comes out again when it is what the entry already had.
  const put = (path, value) => {
    if (same(value, tune.baseAt(e.entry, path))) delete tuned[path]; else tuned[path] = value;
  };
  const soon = () => {
    paint();
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; rebuild(); });
  };
  const change = (path, v) => {
    const m = path.match(/^(.*)\.(\d+)$/);
    const per = perMap()[path];
    if (per) {
      // A Per angle setting changes at the angle shown.
      setPer(path, { ...per, [card.angle]: v });
    } else if (m) {
      const [, parent, i] = m;
      const next = JSON.parse(JSON.stringify(tuned[parent] ?? tune.baseAt(e.entry, parent)));
      next[Number(i)] = v;
      put(parent, next);
    } else {
      put(path, v);
    }
    soon();
  };
  // The handles of the body held at the top or the bottom; a drag sets the same numbers the sliders do.
  let showing = 'loop';
  const handles = () => {
    if (showing === 'loop' || !built) { s.setHandles([], () => {}); return; }
    const d = showing === 'top' ? 0 : 1;
    const P = built.stage.pose(d);
    s.setHandles(tune.handlesAt(built.entry, built.stage, P, d), (h, point) => {
      for (const [path, value] of Object.entries(h.drag(point))) {
        // A point's numbers that are Per angle change at the angle shown; the others as ever.
        const leaves = Array.isArray(value) ? value.map((v, i) => [`${path}.${i}`, v]) : [];
        if (leaves.some(([leaf]) => perMap()[leaf])) {
          const rest = JSON.parse(JSON.stringify(tuned[path] ?? tune.baseAt(e.entry, path)));
          leaves.forEach(([leaf, v], i) => { if (perMap()[leaf]) setPer(leaf, { ...perMap()[leaf], [card.angle]: v }); else rest[i] = v; });
          put(path, rest);
        } else if (perMap()[path]) {
          setPer(path, { ...perMap()[path], [card.angle]: value });
        } else {
          put(path, value);
        }
      }
      soon();
    });
  };

  // One step of a setting: a centimetre, a degree, a twentieth; ten with Shift.
  const nudge = (r, direction, big) => {
    const v = valueNow(r.t) + direction * r.t.step * (big ? 10 : 1);
    change(r.t.path, Number(v.toFixed(4)));
    r.num.value = Number(valueNow(r.t).toFixed(3));
  };
  const make = () => {
    box.replaceChildren();
    rows = [];
    const groups = new Map(tune.HEADINGS.map((h) => [h.name, { h, items: [] }]));
    for (const t of tune.tunables(e.entry)) groups.get(tune.headingOf(t.path).name).items.push(t);
    for (const { h, items } of groups.values()) {
      if (!items.length) continue;
      const group = document.createElement('details');
      group.open = h.open;
      group.innerHTML = '<summary></summary>';
      group.firstChild.textContent = h.name;
      for (const t of items) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<label></label><button type="button" class="step" tabindex="-1">\u2212</button><input type="range" tabindex="-1"><button type="button" class="step" tabindex="-1">+</button><input type="number" class="value" step="any"><button type="button" class="undo" tabindex="-1" title="Back to the saved value" aria-label="Reset">\u21ba</button><button type="button" class="scope" tabindex="-1" aria-pressed="false"></button>';
        const [label, minus, input, plus, num, undo, scope] = row.children;
        const r = { t, row, input, num, undo, scope, typing: false };
        // Only an adjustable bench has angles to tune apart.
        scope.hidden = !e.angles;
        num.id = `${e.id}-${t.path}`;
        label.htmlFor = num.id;
        label.textContent = t.path;
        label.title = `${t.path} (${t.unit.trim() || 'ratio'}, step ${t.step})`;
        minus.setAttribute('aria-label', `Less ${t.path}`);
        plus.setAttribute('aria-label', `More ${t.path}`);
        const at = tune.valueAt(tune.applyTuned(e.entry, tuned), t.path) ?? t.value;
        input.min = Math.min(t.min, at);
        input.max = Math.max(t.max, at);
        input.step = 'any';
        input.addEventListener('input', () => change(t.path, Number(Number(input.value).toFixed(4))));
        minus.addEventListener('click', (ev) => nudge(r, -1, ev.shiftKey));
        plus.addEventListener('click', (ev) => nudge(r, 1, ev.shiftKey));
        undo.addEventListener('click', () => {
          const was = savedPer()[t.path];
          setPer(t.path, was && JSON.parse(JSON.stringify(was)));
          if (!was) change(t.path, savedOf(t)); else soon();
        });
        // `Per angle` starts at the value shown, at the angle shown; back to `All angles` keeps that value.
        scope.addEventListener('click', () => {
          const v = valueNow(t);
          if (perMap()[t.path]) { setPer(t.path, undefined); change(t.path, v); } else { setPer(t.path, { [card.angle]: v }); soon(); }
        });
        // A number can be typed; the slider and the body follow it.
        num.addEventListener('input', () => {
          r.typing = true;
          const v = num.valueAsNumber;
          if (!Number.isFinite(v)) return;
          input.min = Math.min(input.min, v);
          input.max = Math.max(input.max, v);
          change(t.path, v);
        });
        num.addEventListener('focus', () => { r.typing = false; num.select(); });
        // ←/→ and ↓/↑ move the focused setting a step, Shift ten. In the number field the sideways
        // keys move the caret once something has been typed.
        row.addEventListener('keydown', (ev) => {
          if (ev.target !== num && ev.target !== input) return;
          if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
          const sideways = ev.key === 'ArrowLeft' || ev.key === 'ArrowRight';
          const vertical = ev.key === 'ArrowUp' || ev.key === 'ArrowDown';
          if (!sideways && !vertical) return;
          if (sideways && ev.target === num && r.typing) return;
          ev.preventDefault();
          r.typing = false;
          nudge(r, ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -1 : 1, ev.shiftKey);
          if (ev.target === num) num.select();
        });
        group.append(row);
        rows.push(r);
      }
      box.append(group);
    }
    paint();
  };

  const close = () => {
    opened = false;
    node.classList.remove('tuning');
    clearTimeout(timer);
    s.setLive(null);
    s.setHandles([], () => {});
    fillChecks(list, e.checks);
    panel.hidden = true;
    button.setAttribute('aria-expanded', 'false');
  };
  card.rebuild = () => { if (opened) { paint(); rebuild(); } };
  card.refreshMarks();
  button.addEventListener('click', () => {
    if (opened) { close(); return; }
    opened = true;
    tuned = tunedOf(verdicts[e.id]);
    panel.hidden = false;
    node.classList.add('tuning');
    button.setAttribute('aria-expanded', 'true');
    make();
    rebuild();
    // The card grows to the window; bring it into view with its stage.
    node.scrollIntoView({ block: 'start' });
  });
  // Enter presses OK on the open card, from anywhere but a text box or a button of its own.
  node.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' || !opened || ev.isComposing || ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (['TEXTAREA', 'BUTTON', 'SUMMARY', 'A'].includes(ev.target.tagName)) return;
    ev.preventDefault();
    card.ok.click();
  });
  // A fallback if the save fails: the tuned numbers as JSON, on the clipboard (or in a box to copy by hand).
  panel.querySelector('.copy').addEventListener('click', async () => {
    const text = JSON.stringify({ exercise: e.id, clip: e.hash, tuned: card.tuned() }, null, 2);
    card.saved.removeAttribute('data-error');
    try {
      await navigator.clipboard.writeText(text);
      card.saved.textContent = 'Numbers copied';
    } catch {
      let box = panel.querySelector('.copybox');
      if (!box) { box = document.createElement('textarea'); box.className = 'copybox'; box.readOnly = true; panel.append(box); }
      box.value = text;
      box.select();
      const done = document.execCommand?.('copy');
      card.saved.textContent = done ? 'Numbers copied' : 'Copy the numbers from the box';
    }
  });
  // Reset all: every setting goes back to the saved value, otherwise the entry's own.
  panel.querySelector('.reset').addEventListener('click', () => { tuned = tunedOf(verdicts[e.id]); paint(); rebuild(); });
  for (const b of panel.querySelectorAll('[data-show]')) {
    b.addEventListener('click', () => {
      s.setShow(b.dataset.show);
      showing = b.dataset.show;
      handles();
      for (const o of panel.querySelectorAll('[data-show]')) o.setAttribute('aria-pressed', String(o === b));
    });
  }
  // What the verdict saves: what is tuned now, or what was saved before if the panel stayed shut.
  card.tuned = () => (opened ? tuned : tunedOf(verdicts[e.id]));
}

const stages = [];
const visible = new Set();
const seen = new IntersectionObserver((entries) => {
  for (const x of entries) (x.isIntersecting ? visible.add(x.target) : visible.delete(x.target));
});

for (const e of BATCH.exercises) {
  const node = document.getElementById('card').content.firstElementChild.cloneNode(true);
  node.querySelector('h2').textContent = e.name;
  node.querySelector('.meta').textContent = `${e.equipment.replace('_', ' ')}${e.traced ? ' · traced' : ''}`;
  const holder = node.querySelector('.stage');
  holder.setAttribute('aria-label', `${e.name}: drag or use the arrow keys to turn, double-tap to reset`);
  const list = node.querySelector('.checks');
  fillChecks(list, e.checks);
  const note = node.querySelector('textarea');
  note.id = `note-${e.id}`;
  node.querySelector('label').htmlFor = note.id;
  node.querySelector('label').textContent = 'Note';
  const card = { state: node.querySelector('.state'), ok: node.querySelector('.ok'), save: node.querySelector('.save'), saved: node.querySelector('.saved'), note, dirty: false };
  note.addEventListener('input', () => { card.dirty = true; card.saved.textContent = ''; });
  cards[e.id] = card;
  sheet.append(node);
  const s = stage(e, holder.querySelector('canvas'), holder);
  s.holder = holder;
  // An adjustable bench shows at its typical angle first, and each baked angle can be chosen.
  card.angle = e.typical;
  if (e.angles) {
    const seg = node.querySelector('.angles');
    seg.hidden = false;
    const nearest = Object.keys(e.angles).map(Number).reduce((n, a) => (Math.abs(a - e.typical) < Math.abs(n - e.typical) ? a : n));
    card.angleButtons = {};
    for (const a of Object.keys(e.angles)) {
      const b = document.createElement('button');
      card.angleButtons[a] = b;
      b.type = 'button';
      b.textContent = `${a}°`;
      b.setAttribute('aria-pressed', String(Number(a) === nearest));
      b.addEventListener('click', () => {
        for (const o of seg.children) o.setAttribute('aria-pressed', String(o === b));
        card.angle = Number(a);
        s.setAngle(a);
        card.rebuild?.();
      });
      seg.append(b);
    }
  }
  tuning(e, node, card, s);
  stages.push(s);
  seen.observe(holder);
}
render();

const t0 = performance.now();
const frame = (now) => {
  for (const s of stages) if (visible.has(s.holder)) s.draw((now - t0) / 1000);
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => stages.forEach((s) => s.colour()));
new MutationObserver(() => stages.forEach((s) => s.colour())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// The verdicts: one document per exercise, `verdicts/<id>`, naming the clip it was given on.
const controls = () => Object.values(cards).flatMap((c) => [c.ok, c.save, c.note]);
controls().forEach((el) => { el.disabled = true; });
banner.textContent = 'Loading the verdicts…';
const db = await window.claude?.use?.('db');
if (!db) {
  banner.textContent = 'Verdicts can\'t be saved in this view. Open the page on claude.ai, signed in, to mark exercises OK or leave notes.';
} else {
  const slow = setTimeout(() => { banner.textContent = 'The verdicts can\'t be reached yet. They\'ll appear when they load.'; }, 10000);
  db.collection('verdicts').onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(slow); banner.textContent = ''; }
    for (const k of Object.keys(verdicts)) delete verdicts[k];
    for (const d of snap.docs) verdicts[d.id] = d.data();
    controls().forEach((el) => { el.disabled = false; });
    render();
  }, (err) => {
    clearTimeout(slow);
    banner.textContent = `The verdicts stopped updating (${err.code}). Reload the page to see the latest.`;
  });
  const within = (promise, ms) => Promise.race([promise, new Promise((_, no) => setTimeout(() => no({ code: 'no_answer', message: `no answer in ${ms / 1000} s` }), ms))]);
  // A save shows as saved only once the database answers and holds it; any failure shows on the card.
  const save = async (e, change) => {
    const c = cards[e.id];
    c.ok.disabled = c.save.disabled = true;
    c.saved.removeAttribute('data-error');
    c.saved.textContent = 'Saving…';
    try {
      const before = verdicts[e.id] ?? { ok: false, note: '' };
      const next = { ok: before.ok && before.clip === e.hash, note: c.note.value.trim(), ...change, clip: e.hash, at: new Date().toISOString(), via: change.ok === undefined ? 'save-note' : 'ok-button', tuned: JSON.stringify(c.tuned()) };
      const ref = db.doc(`verdicts/${e.id}`);
      await within(ref.set(next), 10000);
      const back = (await within(ref.get(), 10000)).data();
      if (back?.at !== next.at) throw { code: 'not_stored', message: 'the database still holds an older verdict' };
      c.dirty = false;
      c.saved.textContent = change.ok === undefined ? 'Note saved' : next.ok ? 'Marked OK' : 'OK taken back';
    } catch (err) {
      c.saved.dataset.error = '';
      const why = err?.code === 'invalid_argument' ? 'only the page\'s editors can save' : `${err?.code ?? 'error'}: ${err?.message ?? err}`;
      c.saved.textContent = `NOT SAVED (${why}). Use Tune › Copy numbers.`;
    } finally {
      c.ok.disabled = c.save.disabled = false;
    }
  };
  for (const e of BATCH.exercises) {
    const c = cards[e.id];
    // OK on an OK'd card with unsaved numbers saves them and keeps the OK; otherwise it toggles.
    c.ok.addEventListener('click', () => save(e, { ok: c.unsaved() || !['ok', 'tuned'].includes(stateOf(e)) }));
    c.save.addEventListener('click', () => save(e, {}));
  }
}
</script>
