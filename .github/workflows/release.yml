name: Release

# Pushing a tag vX.Y.Z builds the signed release APK and publishes it as a GitHub release on that
# tag, which the in-app update check reads (SPEC, Distribution). A manual run does everything but
# publish, and uploads the signed APK as a workflow artifact instead.
on:
  push:
    tags:
      - "v*"
    branches:
      - ticket/22-release
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, vX.Y.Z (not published)"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only a tag run publishes; any other run is a dry run.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.1' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.HYPERLOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "HYPERLOG_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperlog.p12"
          echo "HYPERLOG_KEYSTORE_FILE=$RUNNER_TEMP/hyperlog.p12" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          HYPERLOG_KEYSTORE_PASSWORD: ${{ secrets.HYPERLOG_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease "-PhyperlogVersion=$TAG"

      - name: Verify the signature
        run: |
          VERSION="${TAG#v}"
          APK="$RUNNER_TEMP/hyperlog-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/hyperlog.p12"

      - name: Upload the APK (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hyperlog-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$APK" --title "$TAG" --verify-tag --notes "Hyperlog ${TAG#v}"
