# Temporary (#132): runs the unit tests several times to catch the check-in tests' timeouts with a thread dump.
name: Flake hunt

on:
  push:
    branches: [feat/132-carry-the-training-style]

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: nproc && ./gradlew testDebugUnitTest --rerun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hunt-${{ matrix.run }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
